services:
  app:
    build: .
    container_name: task_3_app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: task_3_db
    restart: always
    environment:
      MYSQL_DATABASE: task_3
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: matias
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: